<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Saf Kod Survival Oyunu</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; pointer-events: none; }
        #inventory { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; height: 220px; background: rgba(20,20,20,0.9); color: white; padding: 20px; display: none; border-radius: 10px; border: 2px solid #555; }
    </style>
</head>
<body>

    <div id="ui">CAN: 100 | AÇLIK: 100<br>ODUN: 0 | TAŞ: 0</div>
    <div id="crosshair">+</div>
    <div id="inventory">
        <h2>ENVANTER</h2>
        <p id="inv-text">- Odun: 0<br>- Taş: 0</p>
        <p style="font-size: 14px; color: #aaa;">[E] Kapat</p>
    </div>

    <!-- 3D Kütüphanesi (Three.js CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Sahne, Kamera ve Motor
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Gökyüzü

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Işıklandırma ve Deniz
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 40, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x505050));

        const sea = new THREE.Mesh(
            new THREE.PlaneGeometry(1500, 1500),
            new THREE.MeshBasicMaterial({ color: 0x1e90ff, transparent: true, opacity: 0.85 })
        );
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -1.2;
        scene.add(sea);

        // 3. Adalar (Ana Ada + Karşıdaki Adalar)
        createIsland(0, 0, 80, 80, 0x2e8b57);   // Bizim Ada
        createIsland(140, 110, 60, 60, 0x228b22); // Sağ Ada
        createIsland(-130, -120, 70, 70, 0x228b22);// Sol Ada

        function createIsland(x, z, w, h, color) {
            const island = new THREE.Mesh(
                new THREE.BoxGeometry(w, 3, h),
                new THREE.MeshLambertMaterial({ color: color })
            );
            island.position.set(x, -1.5, z);
            scene.add(island);
        }

        // 4. Ağaçlar ve Taşlar
        const interactables = [];

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3, 0.8), new THREE.MeshLambertMaterial({ color: 0x8B4513 }));
            trunk.position.y = 1.5;
            group.add(trunk);

            const leaves = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), new THREE.MeshLambertMaterial({ color: 0x228B22 }));
            leaves.position.y = 3.5;
            group.add(leaves);

            group.position.set(x, 0, z);
            group.userData = { type: 'tree' };
            scene.add(group);
            interactables.push(group);
        }

        function createRock(x, z) {
            const rock = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 1.2, 1.5),
                new THREE.MeshLambertMaterial({ color: 0x808080 })
            );
            rock.position.set(x, 0.6, z);
            rock.userData = { type: 'rock' };
            scene.add(rock);
            interactables.push(rock);
        }

        // Haritaya Rastgele Kaynak Dizilimi
        for (let i = 0; i < 15; i++) createTree(Math.random() * 60 - 30, Math.random() * 60 - 30);
        for (let i = 0; i < 8; i++) createRock(Math.random() * 60 - 30, Math.random() * 60 - 30);

        // 5. Oyuncu Statları ve Hareket Kontrolleri
        let health = 100, hunger = 100, wood = 0, stone = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isInvOpen = false;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = true;
            if (e.key === 's' || e.key === 'S') moveBackward = true;
            if (e.key === 'a' || e.key === 'A') moveLeft = true;
            if (e.key === 'd' || e.key === 'D') moveRight = true;
            
            // E Tuşu ile Envanter
            if (e.key === 'e' || e.key === 'E') {
                isInvOpen = !isInvOpen;
                document.getElementById('inventory').style.display = isInvOpen ? 'block' : 'none';
                document.getElementById('inv-text').innerHTML = `- Odun: ${wood}<br>- Taş: ${stone}`;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = false;
            if (e.key === 's' || e.key === 'S') moveBackward = false;
            if (e.key === 'a' || e.key === 'A') moveLeft = false;
            if (e.key === 'd' || e.key === 'D') moveRight = false;
        });

        // Fare ile Etrafa Bakma (Pointer Lock)
        document.addEventListener('click', () => {
            if (!isInvOpen) document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && !isInvOpen) {
                camera.rotation.y -= e.movementX * 0.0025;
            }
        });

        // Sol Tık ile Kaynak Toplama
        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !isInvOpen) {
                for (let i = interactables.length - 1; i >= 0; i--) {
                    const obj = interactables[i];
                    if (camera.position.distanceTo(obj.position) < 5) {
                        if (obj.userData.type === 'tree') wood += 5;
                        if (obj.userData.type === 'rock') stone += 3;
                        scene.remove(obj);
                        interactables.splice(i, 1);
                        break;
                    }
                }
            }
        });

        // 6. Oyun Döngüsü
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (!isInvOpen) {
                hunger -= 0.6 * delta;
                if (hunger <= 0) { hunger = 0; health -= 1.5 * delta; }

                const speed = 6 * delta;
                if (moveForward) camera.translateZ(-speed);
                if (moveBackward) camera.translateZ(speed);
                if (moveLeft) camera.translateX(-speed);
                if (moveRight) camera.translateX(speed);
                camera.position.y = 2; // Göz yüksekliği
            }

            document.getElementById('ui').innerHTML = `CAN: ${Math.floor(health)} | AÇLIK: ${Math.floor(hunger)}<br>ODUN: ${wood} | TAŞ: ${stone}`;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
