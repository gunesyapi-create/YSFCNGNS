<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS-PRIME: ONLINE LOBBY</title>
    <!-- Ücretsiz Online Altyapı (PeerJS) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #090a10;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* GİRİŞ VE LOBİ EKRANI */
        #lobby-screen {
            background: rgba(18, 20, 32, 0.95);
            border: 2px solid #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 380px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 2px;
        }

        .input-group {
            margin: 15px 0;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ff00ff;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #090a10;
            border: 1px solid #00ffff;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #00ffff;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        button:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 15px #ff00ff;
        }

        .divider {
            margin: 20px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #ffcc00;
        }

        /* OYUN EKRANI */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            border: 2px solid #00ffff;
            background: #10121d;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
        }

        .controls-info {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ & ARAMA EKRANI -->
    <div id="lobby-screen">
        <h1>CHRONOS-PRIME</h1>
        <p style="font-size:12px; color:#aaa;">Ücretsiz Online 2D Arena</p>
        
        <div class="input-group">
            <label>NICKNAME (İSMİN)</label>
            <input type="text" id="nickname" value="Oyuncu1" maxlength="10">
        </div>

        <button onclick="createRoom()">ODAKUR (HOST)</button>

        <div class="divider"></div>

        <div class="input-group">
            <label>ODA KODU GİR</label>
            <input type="text" id="room-code-input" placeholder="Örn: 4821">
        </div>

        <button onclick="joinRoom()">ODAYA KATIL</button>

        <div id="status">Lobiye giriş yap bekleniyor...</div>
    </div>

    <!-- 2. OYUN EKRANI -->
    <div id="game-screen">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="controls-info">Kontroller: <b>W, A, S, D</b> ile hareket et. Karşıdaki arkadaşını takip et!</div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let isHost = false;
        let myNick = "Oyuncu";

        // Oyuncu Bilgileri
        let myPos = { x: 100, y: 200, color: "#00ffff" };
        let otherPos = { x: 700, y: 200, color: "#ff00ff", nick: "Rakip" };

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const keys = {};

        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // 1. ODA KURMA (HOST)
        function createRoom() {
            myNick = document.getElementById("nickname").value || "Oyuncu";
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            document.getElementById("status").innerText = "Oda kuruluyor...";

            peer = new Peer("chronos-" + randomCode);

            peer.on('open', id => {
                isHost = true;
                document.getElementById("status").innerHTML = `Oda Kuruldu!<br><b>ODA KODUN: <span style="color:#00ffff; font-size:18px;">${randomCode}</span></b><br>Arkadaşına bu kodu ver!`;
            });

            peer.on('connection', connection => {
                conn = connection;
                setupConnection();
            });
        }

        // 2. ODAYA KATILMA (CLIENT)
        function joinRoom() {
            myNick = document.getElementById("nickname").value || "Oyuncu";
            const code = document.getElementById("room-code-input").value.trim();

            if (!code) {
                alert("Lütfen oda kodunu gir!");
                return;
            }

            document.getElementById("status").innerText = "Odaya bağlanılıyor...";

            peer = new Peer();

            peer.on('open', id => {
                conn = peer.connect("chronos-" + code);
                setupConnection();
            });
        }

        // 3. BAĞLANTI SAĞLANDIĞINDA OYUNU BAŞLAT
        function setupConnection() {
            conn.on('open', () => {
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("game-screen").style.display = "flex";

                // İlk isim bilgisini at
                conn.send({ type: 'init', nick: myNick });

                // Oyun Döngüsünü Başlat
                requestAnimationFrame(gameLoop);
            });

            // Karşı taraftan veri geldiğinde
            conn.on('data', data => {
                if (data.type === 'init') {
                    otherPos.nick = data.nick;
                } else if (data.type === 'move') {
                    otherPos.x = data.x;
                    otherPos.y = data.y;
                }
            });
        }

        // 4. OYUN DÖNGÜSÜ & ÇİZİM
        function gameLoop() {
            // Hareket Kontrolü
            let moved = false;
            const speed = 4;

            if (keys["KeyW"] || keys["ArrowUp"]) { myPos.y -= speed; moved = true; }
            if (keys["KeyS"] || keys["ArrowDown"]) { myPos.y += speed; moved = true; }
            if (keys["KeyA"] || keys["ArrowLeft"]) { myPos.x -= speed; moved = true; }
            if (keys["KeyD"] || keys["ArrowRight"]) { myPos.x += speed; moved = true; }

            // Ekran Sınırları
            myPos.x = Math.max(20, Math.min(canvas.width - 20, myPos.x));
            myPos.y = Math.max(20, Math.min(canvas.height - 20, myPos.y));

            // Konumu arkadaşına canlı gönder
            if (moved && conn) {
                conn.send({ type: 'move', x: myPos.x, y: myPos.y });
            }

            // --- ÇİZİM ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Izgara Deseni Arka Plan
            ctx.strokeStyle = "rgba(0, 255, 255, 0.05)";
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Kendi Karakterimiz
            drawPlayer(myPos.x, myPos.y, isHost ? "#00ffff" : "#ff00ff", myNick + " (Sen)");

            // Rakip/Arkadaş Karakteri
            drawPlayer(otherPos.x, otherPos.y, isHost ? "#ff00ff" : "#00ffff", otherPos.nick);

            requestAnimationFrame(gameLoop);
        }

        function drawPlayer(x, y, color, label) {
            ctx.fillStyle = color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            
            // Karakter Gövdesi
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();

            // İsim Etiketi
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(label, x, y - 22);
        }
    </script>
</body>
</html>
