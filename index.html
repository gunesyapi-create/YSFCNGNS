<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate WebCraft 3D Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #87ceeb; user-select: none; }
        
        /* HUD & Arayüz */
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; line-height: 1.6; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.9); font-size: 24px; pointer-events: none; z-index: 10; }
        
        /* Minecraft Hotbar */
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 8px; border-radius: 12px; border: 2px solid #444; z-index: 10; }
        .slot { width: 60px; height: 60px; background: rgba(45,45,45,0.85); border: 2px solid #666; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; position: relative; cursor: pointer; transition: 0.1s; }
        .slot.active { border-color: #fff; background: rgba(90,90,90,0.95); transform: scale(1.05); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .slot span { font-size: 11px; position: absolute; bottom: 3px; right: 6px; color: #ffeb3b; text-shadow: 1px 1px #000; }

        /* Envanter & Crafting Ekranı */
        #inventory-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 720px; height: 500px; background: rgba(18,18,18,0.96); color: white; padding: 30px; display: none; border-radius: 14px; border: 3px solid #555; box-shadow: 0 20px 50px rgba(0,0,0,0.9); z-index: 20; }
        #inventory-screen h2 { margin-top: 0; border-bottom: 2px solid #444; padding-bottom: 12px; font-size: 24px; color: #4caf50; }
        .inv-section { margin-top: 20px; }
        .btn-action { padding: 10px 18px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; margin-right: 10px; }
        .btn-craft { background: #e53935; }
        .btn-craft:hover { background: #c62828; }
        .btn-eat { background: #43a047; }
        .btn-eat:hover { background: #2e7d32; }

        #notification { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #4caf50; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 15px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 30; border: 2px solid #4caf50; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="hud">
        CAN: <span id="hp-val">100</span> | AÇLIK: <span id="hunger-val">100</span><br>
        ZAMAN: <span id="time-val">Gündüz</span><br>
        KOORDİNAT: <span id="pos-val">0, 0, 0</span>
    </div>
    <div id="crosshair">+</div>
    <div id="notification">Yükleme Tamamlandı!</div>

    <div id="hotbar">
        <div class="slot active" id="h-slot-0">Odun<span id="count-wood">0</span></div>
        <div class="slot" id="h-slot-1">Taş<span id="count-stone">0</span></div>
        <div class="slot" id="h-slot-2">Yiyecek<span id="count-food">5</span></div>
        <div class="slot" id="h-slot-3">Blok<span id="count-block">15</span></div>
    </div>

    <div id="inventory-screen">
        <h2>ENVANTER & ÜRETİM</h2>
        <div class="inv-section">
            <button class="btn-action btn-craft" onclick="craftItem('pickaxe')">Taş Kazma Üret</button>
            <button class="btn-action btn-eat" onclick="eatFood()">Yemek Ye (+25)</button>
        </div>
    </div>

    <!-- Alternatif Güvenli Three.js Bağlantısı -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof THREE === 'undefined') {
                alert("Three.js kütüphanesi yüklenemedi. Lütfen internet bağlantınızı kontrol edip sayfayı yenileyin.");
                return;
            }

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Zemin
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Gerçekçi Ağaç
            function createTree(x, z) {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
                trunk.position.y = 2;
                group.add(trunk);

                const leaves = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x006400 }));
                leaves.position.y = 4.5;
                group.add(leaves);

                group.position.set(x, 0, z);
                scene.add(group);
            }

            for(let i=0; i<20; i++) {
                createTree((Math.random()-0.5)*100, (Math.random()-0.5)*100);
            }

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
